    </filter>
  </defs>
  <rect width="100" height="100" fill="#050510" rx="20" />
  <g filter="url(#glow)">
    <path d="M 30 70 L 30 40 A 20 20 0 0 1 70 40 L 70 70 Z" fill="none" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="55" r="5" fill="#39ff14" />
    <circle cx="65" cy="55" r="5" fill="#ff003c" />
    <rect x="45" y="30" width="10" height="10" fill="#0ff" rx="2" />
